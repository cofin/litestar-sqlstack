[project]
authors = [{ name = "Cody Fincher", email = "cody@litestar.dev" }]
dependencies = [
    "httpx-oauth>=0.16.1",
    "litestar-granian[uvloop]>=0.12.2",
    "litestar[structlog,jwt,jinja]>=2.15.2",
    "pwdlib[argon2]>=0.2.1",
    "dishka",
    "sqlspec[asyncpg,duckdb,performance,polars,mypyc] @ git+https://github.com/litestar-org/sqlspec.git@main",
]
description = "A Reference Implementation of a Litestar and SQLSpec Application"
name = "sqlstack"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"

[project.urls]
Discord = "https://discord.gg/litestar"
Homepage = "https://github.com/cofin/litestar-sqlstack"
Source = "https://github.com/cofin/litestar-sqlstack"

[project.scripts]
sqlstack = "sqlstack.__main__:run_cli"


[dependency-groups]
build = ["bump-my-version", "cython"]
dev = [
    { include-group = "docs" },
    { include-group = "linting" },
    { include-group = "test" },
    { include-group = "build" },
]
docs = []
linting = ["pre-commit", "mypy", "ruff", "slotscheck", "types-click", "types-pyyaml", "pyright"]
test = ["pytest", "anyio", "pytest-mock", "pytest-cov", "coverage[toml]", "pytest-sugar", "pytest-databases[postgres]"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["sqlstack"]
[tool.hatch.metadata]
allow-direct-references = true

[tool.bumpversion]
allow_dirty = false
commit = false
commit_args = "--no-verify"
current_version = "0.2.0"
ignore_missing_files = false
ignore_missing_version = false
message = "Bump version: {current_version} → {new_version}"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
regex = false
replace = "{new_version}"
search = "{current_version}"
serialize = ["{major}.{minor}.{patch}"]
sign_tags = false
tag = false
tag_message = "Bump version: {current_version} → {new_version}"
tag_name = "v{new_version}"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
replace = 'version = "{new_version}"'
search = 'version = "{current_version}"'


# tests

[tool.coverage.report]
exclude_lines = [
    'if TYPE_CHECKING:',
    'pragma: no cover',
    "if __name__ == .__main__.:",
    'def __repr__',
    'if self\.debug:',
    'if settings\.DEBUG',
    'raise AssertionError',
    'raise NotImplementedError',
    'if 0:',
    'class .*\bProtocol\):',
    '@(abc\.)?abstractmethod',
]
omit = ["*/tests/*"]
show_missing = true

[tool.coverage.run]
branch = true
concurrency = ["multiprocessing"]
omit = ["**/*/tests/*", "tools/*"]
parallel = true
relative_files = true

[tool.pytest.ini_options]
addopts = ["-q", "-ra"]
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:google.*",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:aiosql.*",
    "ignore::DeprecationWarning:litestar.constants.*",
    "ignore::DeprecationWarning:litestar.utils.*",
    "ignore::DeprecationWarning:litestar.cli.*",
    "ignore::DeprecationWarning:httpx._client",
]
markers = ["unit: Execute unit tests", "integration: Execute integration tests"]
testpaths = ["tests"]


[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    '__pycache__',

]
fix = true
line-length = 120
src = ["sqlstack", "tests"]
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60
preview = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
    "A003",    # flake8-builtins - class attribute {name} is shadowing a python builtin
    "A005",    # flake8-builtins - module {name} shadows a Python standard-library module
    "B010",    # flake8-bugbear - do not call setattr with a constant attribute value
    "D100",    # pydocstyle - missing docstring in public module
    "D101",    # pydocstyle - missing docstring in public class
    "D102",    # pydocstyle - missing docstring in public method
    "D103",    # pydocstyle - missing docstring in public function
    "D104",    # pydocstyle - missing docstring in public package
    "D105",    # pydocstyle - missing docstring in magic method
    "D106",    # pydocstyle - missing docstring in public nested class
    "D107",    # pydocstyle - missing docstring in __init__
    "D202",    # pydocstyle - no blank lines allowed after function docstring
    "D205",    # pydocstyle - 1 blank line required between summary line and description
    "D415",    # pydocstyle - first line should end with a period, question mark, or exclamation point
    "E501",    # pydocstyle line too long, handled by black
    "PLW2901", # pylint - for loop variable overwritten by assignment target
    "RUF012",  # Ruff-specific rule - annotated with classvar
    "ANN401",
    "FBT",
    "PLR0913", # too many arguments
    "PT",
    "TD",
    "ARG002",  # ignore for now; investigate
    "ARG003",  # ignore for now; investigate
    "PERF203", # ignore for now; investigate
    "PD011",   # pandas
    "PLR0912",
    "ISC001",
    "COM812",
    "CPY001",
    "PGH003",
    "FA100",
    "PLC0415", # import should be at the top of the file
    "PLR0904", # too many public methods
    "PLR0917",
    "PGH003",
    "PLC2701",
    "PLW3201",
    "PLR6301",
    "DOC201",
]
select = ["ALL"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ['F401', 'D104']
"docs/**/*.*" = ["S", "B", "DTZ", "A", "TC", "ERA", "D", "RET", "E731", "RUF012", "FA100", "ARG001"]
"docs/conf.py" = ["FIX002", "ARG001", "INP001"]
"sqlstack/db/migrations/*.py" = ['D104', 'D103', 'D205', 'D212']
"tests/*.py" = ['D103', 'S101', "S105", "S106", 'D104', "PLR2004", "RUF029", "ARG001", "SLF001", "DOC"]
"tools/*.py" = ["INP001", "ERA001", "N999"]
"tools/**/*.*" = ["D", "ARG", "EM", "TRY", "G", "FBT", "INP001", "S603", "S404", "S607", "PLR0915"]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pylint]
max-bool-expr = 10
max-branches = 20
max-locals = 20
max-nested-blocks = 7
max-returns = 15

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]

[tool.ruff.lint.isort]
known-first-party = ['tests', 'sqlstack', 'docs', 'tools']
split-on-trailing-comma = false

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.slotscheck]
strict-imports = false

[tool.codespell]
ignore-words-list = "alog,selectin,selectinload"
skip = 'uv.lock, package-lock.json'

[tool.mypy]
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
exclude = '''(?x)(
^build/
|^dist/
|^.venv/
|^node_modules/
|^migrations/
)
'''
implicit_reexport = false
packages = ["sqlstack", "tests", "docs", "tools"]
plugins = []
python_version = "3.12"
show_error_codes = true
strict = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
disable_error_code = "attr-defined,type-var,union-attr"
disallow_untyped_decorators = false
module = ["tests.*"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = ["uvloop", "uvloop.*"]


[tool.pyright]
disableBytesTypePromotions = true
exclude = ["sqlstack/db/migrations"]
include = ["sqlstack"]
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportPrivateImportUsage = false
reportUnknownMemberType = false
reportUnusedFunction = false
strict = ["sqlstack/**/*"]
venv = ".venv"
venvPath = "."
